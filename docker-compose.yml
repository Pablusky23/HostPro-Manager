version: '3.8'

services:

  # Contenedor 1: Apache + PHP
  web:
    build: .
    container_name: hostpro_web
    ports:
      - "8080:80"          # Web en http://localhost:8080
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - hostpro_network

  # Contenedor 2: BBDD MySQL
  db:
    image: mysql:8.0
    container_name: hostpro_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: hostpro_db
      MYSQL_USER: hostpro_user
      MYSQL_PASSWORD: hostpro_pass
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    networks:
      - hostpro_network

  # Contenedor 3: phpMyAdmin (Visualizar la base de datos)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hostpro_phpmyadmin
    ports:
      - "8081:80"          # Accederás a phpMyAdmin en http://localhost:8081
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root1234
    depends_on:
      - db
    networks:
      - hostpro_network

networks:
  hostpro_network:
    driver: bridge

volumes:
  db_data: